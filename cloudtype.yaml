services:
  - name: msmmer-api
    language: nodejs
    version: "22"
    build: npm install --prefix server && npm run build --prefix server && npx prisma generate --schema server/prisma/schema.prisma
    start: npm start --prefix server
    port: 4000
    env:
      - name: PORT
        value: "4000"
      - name: NODE_ENV
        value: production
      # DATABASE_URL과 JWT_SECRET은 클라우드타입 대시보드에서 직접 입력하시는 것을 권장합니다.

  - name: msmmer-client
    language: static
    context: client # 이 설정이 폴더의 기준점을 client 폴더로 바꿉니다.
    build: npm install && npm run build
    dir: dist # client 폴더 기준으로 그 안의 dist 폴더를 서비스합니다.
    env:
      - name: VITE_API_URL
        value: https://msmmer-api.cloudtype.app # 실제 주소로 대시보드에서 덮어쓰기됩니다.
